name: Main

on:
  push:
    branches:
      - 'main'
      - 'master'
      - 'test-ci'

jobs:
  build_apk_aab:
    name: Build qa artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install font dependencies for headless screenshot rendering
        run: sudo apt-get update && sudo apt-get install -y fontconfig fonts-dejavu-core
      - name: Build and verify
        run: |
          ./gradlew testQaUnitTest testDebugUnitTest assembleQa
        env:
          MIXPANEL_TOKEN: ${{ secrets.MIXPANEL_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload to Firebase
        run: |
          ./gradlew appDistributionUploadQa
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          NOTES: ${{ github.event.commits[0].message }}
