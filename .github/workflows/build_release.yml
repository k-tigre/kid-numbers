name: Release

on:
  push:
    tags:
      - 'v.[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build_apk_aab:
    name: Build release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python deps for marketing assets
        run: pip install pillow
      - name: Prepare release version and notes
        run: |
          chmod +x scripts/bump-version.sh scripts/generate-play-release-notes.sh scripts/commit-release-assets.sh
          ./scripts/bump-version.sh
          ./scripts/generate-play-release-notes.sh alpha
          python scripts/changelog_tool.py finalize --version "${GITHUB_REF_NAME#refs/tags/v.}"
      - name: Build, publish listing, and upload to Play
        run: |
          ./gradlew testReleaseUnitTest publishReleaseToPlay assembleRelease
        env:
          NUMBERS_RELEASE_JKS: ${{ secrets.NUMBERS_RELEASE_JKS }}
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.ANDROID_PUBLISHER_CREDENTIALS }}
          MIXPANEL_TOKEN: ${{ secrets.MIXPANEL_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit release assets to master
        run: ./scripts/commit-release-assets.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: |
            androidApp/build/outputs/apk/release/androidApp-release.apk
            androidApp/build/outputs/bundle/release/androidApp-release.aab
            docs/marketing/assets/output/screenshots/**/*
            docs/marketing/assets/output/feature-graphic/**/*
