name: Publish Play listing

on:
  workflow_dispatch:

jobs:
  publish_listing:
    name: Upload Play Store listing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Publish listing metadata to Play
        run: ./gradlew publishPlayListing
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.ANDROID_PUBLISHER_CREDENTIALS }}
          PLAY_CONTACT_EMAIL: ${{ vars.PLAY_CONTACT_EMAIL }}
          PLAY_CONTACT_WEBSITE: ${{ vars.PLAY_CONTACT_WEBSITE }}
